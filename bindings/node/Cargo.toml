[package]
name = "chronovec-node"
version = "0.1.0"
edition = "2021"
description = "Node.js native addon for ChronoVec, via napi-rs over the Rust crate"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
chronovec = { path = "../rust/chronovec" }
napi = { version = "3", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "3"
# Bridges Collection's dynamic metadata/where-filter objects to and from
# arbitrary JS values -- scoped to this glue crate only, not the zero-dependency
# chronovec/chronovec-sys crates this wraps.
serde_json = "1"
# Used directly to build chronovec::collection::Filter::Regex from a $regex
# filter value -- chronovec already depends on this, declared explicitly
# here too since collection.rs constructs Regex values itself.
regex-lite = "0.1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
